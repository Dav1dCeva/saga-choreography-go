name: saga-choreography

services:
  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    user: "0:0"
    # En Podman rootless el entrypoint oficial intenta bajar a rabbitmq y el
    # volumen anónimo queda sin permisos. Para la demo arrancamos el broker
    # directamente; las colas siguen siendo durables.
    entrypoint: ["rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga}
      POSTGRES_DB: ${POSTGRES_DB:-saga}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${POSTGRES_DB:-saga}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-saga}:${POSTGRES_PASSWORD:-saga}@postgres:5432/orders?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: saga.events
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      HTTP_ADDR: ":8082"
      DATABASE_URL: postgres://${POSTGRES_USER:-saga}:${POSTGRES_PASSWORD:-saga}@postgres:5432/payments?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: saga.events
      FAIL_PAYMENT: ${FAIL_PAYMENT:-false}
      MAX_PAYMENT_AMOUNT: ${MAX_PAYMENT_AMOUNT:-1000}
      BLOCKED_CUSTOMER: ${BLOCKED_CUSTOMER:-blocked}
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://${POSTGRES_USER:-saga}:${POSTGRES_PASSWORD:-saga}@postgres:5432/inventory?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: saga.events
      FAIL_INVENTORY: ${FAIL_INVENTORY:-false}
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    environment:
      HTTP_ADDR: ":8084"
      DATABASE_URL: postgres://${POSTGRES_USER:-saga}:${POSTGRES_PASSWORD:-saga}@postgres:5432/shipping?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASS:-guest}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: saga.events
      FAIL_SHIPPING: ${FAIL_SHIPPING:-false}
    ports:
      - "8084:8084"
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: docker.io/prom/prometheus:v2.53.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    ports:
      - "9090:9090"
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - shipping-service

  grafana:
    image: docker.io/grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  rabbitmq_data:
  grafana_data:
