name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Vet, lint, pruebas y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Descargar dependencias
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2

      - name: Pruebas con race y cobertura
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Resumen de cobertura
        run: go tool cover -func=coverage.out | tail -n 1

      - name: Publicar coverage.out
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build-images:
    name: Construir imagen ${{ matrix.service }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - order-service
          - payment-service
          - inventory-service
          - shipping-service
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: saga/${{ matrix.service }}:ci
